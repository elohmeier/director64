# Tests the host tools, the converter and the runtime contracts. No game media
# is available here: tests run on synthetic fixtures.
name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v5

      # Python, uv and Node as pinned in mise.toml.
      - uses: jdx/mise-action@v3

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target

      - name: Install dependencies
        run: |
          npm ci --ignore-scripts
          uv sync --locked

      # The host pipeline's tests run the bytecode compiler binary.
      - name: Test
        run: |
          cargo build --release --locked --manifest-path compiler/Cargo.toml
          cargo test --release --locked --manifest-path compiler/Cargo.toml
          uv run --locked ruff check src tests games
          uv run --locked pytest -q
          node --test tests/node/*.test.mjs
          .mise-tasks/test-native
