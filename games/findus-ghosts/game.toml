schema_version = 1
slug = "findus-ghosts"
title = "Pettersson und Findus: Die Gespenster-Erschreckmaschine"
status = "experimental"
default_source = "sha256-05d7ad483501"

# A raw CloneCD image (2352-byte sectors); the importer reads its data track.
[android]
title = "Gespenster"

[[sources]]
id = "sha256-05d7ad483501"
file = "CD01.img"
sha256 = "05d7ad48350100e96d1deadb10f0dfd5f099dc19d7b63180647ca756239ed41b"
bytes = 630538272
kind = "iso9660"

[recovery]
director_version = 850
media_root = "."

[port]
extended_d6 = true
director_version = 850
media_root = "."
entry_movie = "START"
launcher_movie = "START.DXR"

[player]
saves = ["pfscore.dat"]
# The launcher's installed-copy test lists the Score folder.
folders = [["score", "pfScore.dat"]]
[player.files]
# The launcher's developer switch plays from the installed copy: no CD drive
# search and no optgraph.dll copy check.
"pfstart.ini" = "[custom]\r\nhdEnabled=1\r\ndebug=0\r\n"
# What the installer writes to the Windows folder: the score folder.
"pfgame.ini" = "[Pettersson]\r\ninstpfad=C:\\Findus\\Score\r\n"

[convert]
# Each scene streams its speech from its own SOUNDS folder, which Lingo
# addresses as "@/sounds/NAME": one "sounds" namespace.
streams = [
  "sounds=DATA/ABSPANN/SOUNDS", "sounds=DATA/BAUMHOEH/SOUNDS", "sounds=DATA/DACHBODE/SOUNDS",
  "sounds=DATA/FINALE/SOUNDS", "sounds=DATA/HOF/SOUNDS", "sounds=DATA/HUEGEL/SOUNDS",
  "sounds=DATA/HUEHNER/SOUNDS", "sounds=DATA/INTRO/SOUNDS", "sounds=DATA/KUECHENA/SOUNDS",
  "sounds=DATA/KUECHETA/SOUNDS", "sounds=DATA/LOGIN/SOUNDS", "sounds=DATA/SCHATTEN/SOUNDS",
  "sounds=DATA/SCHIESSB/SOUNDS", "sounds=DATA/SCHWARZE/SOUNDS",
]

# The film-loop players sweep every channel to puppet a flattened loop's own
# channels, which it no longer has: 2,000 empty iterations a character.
[[convert.patch]]
id = "flattened-loop-puppet-sweep"
movie = "GLOBPROG.CXT"
member = 25
handler = "puppetallsprites"
source_sha256 = "85d9eb23db484959f0ebe059e3347249c150f9aadc9e1d64d964287386b7613f"
body = ""

