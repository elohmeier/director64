schema_version = 1
slug = "findus-circus"
title = "Pettersson und Findus: Hühnertanz und Katerzirkus"
status = "experimental"
default_source = "sha256-40d3f559158e"

# A raw CloneCD image (2352-byte sectors); the importer reads its data track.
[android]
title = "Katerzirkus"

[[sources]]
id = "sha256-40d3f559158e"
file = "CD01.img"
sha256 = "40d3f559158e8f606487563c0d9ad4712cbb6cd6836587d7fc555aaa872be9a9"
bytes = 557699184
kind = "iso9660"

[recovery]
director_version = 850
media_root = "PF2"

[port]
extended_d6 = true
director_version = 850
media_root = "PF2"
entry_movie = "PF2"
launcher_movie = "PF2.DXR"

[player]
saves = ["score.dat", "pf2.ini"]
# The engine locates itself from the projector's folder (ENGINE.CXT
# psPathLocator); PF2\ beside the movie file is its developer layout.
movie_path = "C:\\PF2\\"
# LOGIN's own keyDown handlers type the player's name into editText while
# the score waits at markers 50-52 or 64-66.
key_field = { movie = "LOGIN.DXR", member = "editText", frames = [105, 114, 175, 184] }

[convert]
# The voice and effect members link AIFF files beside the movies.
external_media = { root = "PF2/MOVIES/SOUNDS", extensions = ["AIF"], bind = "linked-sounds" }

# The copy check asks optgraph.dll for the authored Verification constant.
[[convert.patch]]
id = "optgraph-cd-code"
movie = "ENGINE.CXT"
member = 12
handler = "getcdcode"
source_sha256 = "660e4add2b83a06e76279e7010676f44dc61fc03eb694bdeb9480cc29d209404"
body = "return 50576302"

# The copy check asks optgraph.dll for the authored Verification constant.
