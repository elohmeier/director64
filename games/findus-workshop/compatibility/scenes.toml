# Each milestone has its own applicability record and pinned assertion evidence.
# A verified source no-op still requires evidence; missing work never shrinks the denominator.
schema_version = 1
catalog_version = "scenes-v1"

[milestones]
asset_bank = "Target assets are deterministic, bounded and validated"
load_unload = "Scene loads, unloads and survives repeated transitions"
timeline = "Score frames, labels, layers and timing are represented"
input = "Pointer/button behavior and hit regions match the reference"
audio = "Playback, waits, channels and looping match the reference"
logic = "Native scene/game state matches relevant Lingo behavior"
transitions = "Every inbound and outbound transition preserves required state"
service_api = "Shared-cast behavior is exposed through a tested native service"
reference_match = "Named reference scenarios pass with recorded evidence"

[requirements]
movie = [
  "asset_bank",
  "load_unload",
  "timeline",
  "input",
  "audio",
  "logic",
  "transitions",
  "reference_match",
]
cast = ["asset_bank", "service_api", "logic", "reference_match"]

