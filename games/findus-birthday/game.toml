schema_version = 1
slug = "findus-birthday"
title = "Pettersson und Findus: Der Torten werfende Geburtstagskater"
status = "experimental"
default_source = "sha256-dadd038fff19"

# The volume descriptor overstates the volume (copy protection); the decoy
# ZDATA/SOUND.X64 runs past the image and reads as zeros there.
[[sources]]
id = "sha256-dadd038fff19"
file = "Geburtstagskater.iso"
sha256 = "dadd038fff195b08afeb1c97c4c8b8b943d776ff339868856805d96755f0670e"
bytes = 613697536
kind = "iso9660"

[recovery]
director_version = 850
media_root = "SPIEL"

[port]
extended_d6 = true
director_version = 850
media_root = "SPIEL"
entry_movie = "PF3"
launcher_movie = "PF3.DXR"

[player]
saves = ["info.dat", "generalsettings.dat", "###.sav"]
data_folder = "SPIEL/XML"
[player.files]
# The projector's settings with the developers' debug switches: no copy
# check (optgraph.dll), no CD drive search, no display mode change.
"pf3.ini|projector.ini" = "[Settings]\r\nSingleInstance=1\r\n\r\n[Sound]\r\nLowSpoolBufferMs=5000\r\nHighSpoolBufferMs=3000\r\n\r\n[Debug]\r\nCheckCopyProtection=0\r\nCheckCDInsert=0\r\nChangeScreenDim=0\r\n"
# The flag file beside the projector marks the installed data layout.
"cd1pf3.flg" = " "

[convert]
# The string tables and room descriptions FileIO reads as XML.
data = ["SPIEL/XML"]
