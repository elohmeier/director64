# The copy check: getRegOptimal(serNum) asks optgraph.dll and the start
# movie goes on only when it answers the serial; it answers it.
[[convert.patch]]
id = "optgraph-serial"
handler = "getregoptimal"
all = true
calls = "glunew"
body = "return serNum"

# The recovered disc and casts contain no snd/s03i01. Stop its channel and
# keep the absent narration visible in diagnostics while navigation works.
[[convert.patch]]
id = "missing-intro-narration"
movie = "LZ6.CXT"
cast = "External"
member = 166
handler = "exitframe"
source_sha256 = "4c3154b899c4dd45edced489019139abe9fe40231764dd9a39e734a07413f8c7"
body = '''
cursor(icrs())
sound stop 4
put "SOURCE_AUDIO_UNAVAILABLE @:snd:s03i01"
'''
