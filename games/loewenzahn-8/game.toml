schema_version = 1
slug = "loewenzahn-8"
title = "Löwenzahn 8"
status = "experimental"
default_source = "sha256-ebdb5a53bb24"

[[sources]]
id = "sha256-ebdb5a53bb24"
file = "Löwenzahn 8.iso"
sha256 = "ebdb5a53bb2488e0f255ff7c91f6b7f3ae51064538773ef0a193ab1bdabc62d3"
bytes = 701024256
kind = "iso9660"

[recovery]
director_version = 850
media_root = "DATA"

[port]
extended_d6 = true
director_version = 850
media_root = "DATA"
entry_movie = "START"

[player]
stream_paths = true
# The preferences file, whatever its spelling ("Löwenzahn 7.usr").
saves = ["*.usr"]

[convert]
streams = ["BASTELKE/SOUNDS=DATA/BASTELKE/SOUNDS", "BERGWERK/SOUNDS=DATA/BERGWERK/SOUNDS", "FREIZEIT=DATA/FREIZEIT", "FREIZEIT/SOUNDS=DATA/FREIZEIT/SOUNDS", "GALERIE=DATA/GALERIE", "HUNDEQUI/SOUNDS=DATA/HUNDEQUI/SOUNDS", "JODELAUF=DATA/JODELAUF", "KLAVIER=DATA/KLAVIER", "KUHCHAOS/SOUNDS=DATA/KUHCHAOS/SOUNDS", "LEXIKON/SOUNDS=DATA/LEXIKON/SOUNDS", "LEXIKON/SOUNDS/BERGESND=DATA/LEXIKON/SOUNDS/BERGESND", "LOGIN=DATA/LOGIN", "PETERGAL=DATA/PETERGAL", "PHANTOMB=DATA/PHANTOMB", "SEGELREG/SRAUDIOS=DATA/SEGELREG/SRAUDIOS", "TAMAGOTC/SOUNDS=DATA/TAMAGOTC/SOUNDS", "TELEFONM/SOUNDS=DATA/TELEFONM/SOUNDS", "TS=DATA/TS", "WIMMELBI/SOUNDS/BANK=DATA/WIMMELBI/SOUNDS/BANK", "WIMMELBI/SOUNDS/BIKE=DATA/WIMMELBI/SOUNDS/BIKE", "WIMMELBI/SOUNDS/CD=DATA/WIMMELBI/SOUNDS/CD", "WIMMELBI/SOUNDS/DOG=DATA/WIMMELBI/SOUNDS/DOG", "WIMMELBI/SOUNDS/GIMMICKS=DATA/WIMMELBI/SOUNDS/GIMMICKS", "WIMMELBI/SOUNDS/HANDY=DATA/WIMMELBI/SOUNDS/HANDY", "WIMMELBI/SOUNDS/INTROOUT=DATA/WIMMELBI/SOUNDS/INTROOUT", "WIMMELBI/SOUNDS/THIEF=DATA/WIMMELBI/SOUNDS/THIEF", "WIW=DATA/WIW", "YETISPIE/SOUNDS=DATA/YETISPIE/SOUNDS"]
# Both short and Joliet folder names are authored: LZ8.CXT pet reminders
# call @::Tamagotchi:sounds: after the player leaves the dog activity.
# DirectMedia's MPEG-1 movies, wherever the disc keeps them.
external_media = { root = "DATA", extensions = ["MPG"], bind = "directmedia" }

# The copy check: getRegOptimal(serNum) asks optgraph.dll and the start
# movie goes on only when it answers the serial; it answers it.
[[convert.patch]]
id = "optgraph-serial"
handler = "getregoptimal"
all = true
calls = "glunew"
body = "return serNum"

# Keep the telephone introduction and its authored one-player setup, bypassing
# the hotseat chooser when the introduction ends or the activity is restarted.
[[convert.patch]]
id = "single-player-telephone-intro"
movie = "TELEFONM.DXR"
cast = "game"
member = 20
handler = "exitframe"
source_sha256 = "6611f3845b00e259e147f2fb2148df0d20d50e1ba6cdb50b829fad27665d8e48"
prepend = '''
if not soundBusy(4) then
  go("1")
  return
end if
'''

[[convert.patch]]
id = "single-player-telephone-restart"
movie = "TELEFONM.DXR"
cast = "game"
member = 4
handler = "doagain"
source_sha256 = "cd46ae79dd47937c37fca5a7df8c7a9315ab11efa9f5847900a8b705dea7e89c"
body = '''
sound stop 3
sound stop 4
go("1")
'''
