# The platform file chooser replaces the desktop's separate Choose movie.
[[convert.patch]]
id = "player-file-chooser-cleanup"
movie = "06.DXR"
member = 2
handler = "closewindow"
source_sha256 = "9cb4f829e9e23a5271fd9568ca2e71bd5f0eee9d18368bc95c1437a710e7ec0d"
body = """
global gSound, gMulleGlobals
if not (myMIAW = 0) then
  tell_window(myMIAW)
  cleanUp()
  close(myMIAW)
  myMIAW = 0
end if
doNextFrame = #activateScreen
"""

[[convert.patch]]
id = "player-file-chooser"
movie = "06.DXR"
member = 2
handler = "openwindow"
source_sha256 = "b8cdef14b9e36e5fb60da419e8af19c7fc6841c965fa318a7eda2bb109224500"
body = """
global gMulleGlobals, gSound
activateScreen(me, 0)
set file to new(xtra("FileIO"))
if mode = #save then
  set path to displaySave(file, "Speichere dein Auto", defaultFileName & ".car")
  if stringp(path) then
    createFile(file, path)
    openFile(file, path, 2)
    if status(file) = 0 then
      if slotOccupied then
        set tempCar to getSavedCars(the user of gMulleGlobals, chosenSlot)
      else
        set tempCar to toList(the car of the user of gMulleGlobals)
      end if
      writeString(file, string(tempCar))
      closeFile(file)
      if status(file) <> 0 then
        alert("Problem saving file")
      end if
    else
      alert("Problem creating file")
    end if
  end if
else
  setFilterMask(file, "Cars (*.car),*.car")
  set path to displayOpen(file)
  if stringp(path) then
    openFile(file, path, 1)
    if status(file) = 0 then
      set tempList to value(readFile(file))
      closeFile(file)
      if listp(tempList) then
        if checkCar(fileObject, tempList) then
          loadCar(me, tempList)
        else
          stopAllEffects(gSound)
          play(gSound, "07d002v0", #EFFECT)
        end if
      else
        alert("File corrupt")
      end if
    else
      alert("Problem opening file")
    end if
  end if
end if
dispose(file)
activateScreen(me, 1)
"""

